# Portable tmux configuration for Linux.

# Terminal and status
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",*256col*:Tc"
set -g status-style "bg=#262626,fg=#bdae93"
set -g base-index 1
set -g status 2
set -g status-justify left
set -g window-status-separator ""
# Codex completion notifications may arrive as BEL; do not let tmux's default
# reverse-video bell style override the green completed-tab background.
set -g window-status-bell-style none
set -g status-left ""
set -g status-left-length 0
set -g status-interval 1
# Keep the helper running for animation and completion tracking, alongside a prominent hostname.
set -g status-right '#("$HOME/.local/bin/tmux-codex-status" "#{socket_path}")#[fg=#ffbf00,bg=#262626,nobold]#[fg=#40351f,bg=#ffbf00,bold] #(hostname | tr "[:lower:]" "[:upper:]") #[fg=#bdae93,bg=#262626,nobold]'
# Keep the normal status content on the bottom row, with a blank row above.
# Reset first so reloading this file preserves the layout.
set -gu status-format
set -gF status-format[1] '#{status-format[0]}'
set -g status-format[0] '#[bg=#040404,fill=#040404]'
# Follow the spinner supplied by Codex; idle titles keep the normal style.
set -g @codex-working "#{&&:#{==:#{pane_current_command},codex},#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}}}"
set -g @tab-bg "#{?#{E:@codex-working},#654b70,#{?#{||:#{@codex-finished},#{@codex-was-working}},#3e6150,#444444}}"
set -g @active-tab-bg "#ffbf00"
set-hook -g after-select-window[90] 'set-option -w @codex-finished 0'
set -g @codex-spinner "#{?#{==:#{@codex-pulse-frame},0},◐,#{?#{==:#{@codex-pulse-frame},1},◓,#{?#{==:#{@codex-pulse-frame},2},◑,◒}}}"
set -g @tab-number " #I#{s/[*!-]//g:window_flags} "
set -g @tab-title "#{?#{E:@codex-working},#{E:@codex-spinner} #{s/^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] //;s/ *[|].*//:pane_title},#{?#{==:#{pane_current_command},codex},#{s/ *[|] */ · /g:pane_title},#W}}"
set -g window-status-format "#[fg=#262626,bg=#{E:@tab-bg},nobold]#[fg=#{?#{E:@codex-working},#b5abb7,#eee8dc}]#{E:@tab-number} #[#{?#{E:@codex-working},bold,nobold}]#{E:@tab-title} #[fg=#{E:@tab-bg},bg=#262626,nobold]"
set -g window-status-current-format "#[fg=#262626,bg=#{E:@active-tab-bg},bold]#[fg=#40351f]#{E:@tab-number} #{E:@tab-title} #[fg=#{E:@active-tab-bg},bg=#262626,nobold]"

# Keep new panes and windows in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind g display-popup -E -w 50% -h 50% -d "#{pane_current_path}"
bind -n M-g display-popup -E -w 50% -h 50% -d "#{pane_current_path}"

# General behavior
bind-key r run-shell '"$HOME/.local/bin/tmux-next-ready" "#{socket_path}" #{q:session_id} "#{window_index}"'
bind-key -n C-PPage previous-window
bind-key -n C-NPage next-window
set -g cursor-style block
set -g history-limit 20000
set -g display-time 1500
set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g renumber-windows on

# Vim-style copy mode with Wayland and X11 clipboard support when available.
setw -g mode-keys vi
bind-key b copy-mode
bind-key p paste-buffer
if-shell 'command -v xsel >/dev/null 2>&1' 'bind-key p run-shell "xsel --clipboard --output | tmux load-buffer - && tmux paste-buffer"'
if-shell 'command -v xclip >/dev/null 2>&1' 'bind-key p run-shell "xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer"'
if-shell 'command -v wl-paste >/dev/null 2>&1' 'bind-key p run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell 'command -v xsel >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"'
if-shell 'command -v xclip >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Allow tmux and supported terminals to exchange clipboard data via OSC 52.
set -s set-clipboard on
